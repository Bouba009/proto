<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protoptimal - AI Project Builder</title>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- مكتبات استخراج الملفات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
    
    <!-- ايقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #3b82f6;
            --dark-glass: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Poppins', sans-serif;
        }

        body {
            background-color: #020617;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /* --- خلفية المجرة المتحركة --- */
        .galaxy-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at center, #1b0a3a 0%, #020617 100%);
            overflow: hidden;
        }
        .stars, .stars2 {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: transparent;
        }
        .stars { animation: moveStars 100s linear infinite; background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px; }
        .stars2 { animation: moveStars 150s linear infinite; background-image: radial-gradient(1px 1px at 10px 10px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 150px 150px, #fff, rgba(0,0,0,0)); background-repeat: repeat; background-size: 300px 300px; }
        .nebula {
            position: absolute; width: 200vw; height: 200vh;
            background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.15), transparent 60%);
            animation: pulseNebula 20s ease-in-out infinite alternate;
        }
        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(-1000px); } }
        @keyframes pulseNebula { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.2) translate(-5%, -5%); } }

        /* --- الواجهة والتصميم الزجاجي --- */
        .container {
            max-width: 1200px; margin: 0 auto; padding: 20px;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: var(--dark-glass); backdrop-filter: blur(15px);
            border-radius: 15px; border: 1px solid var(--border-glass); margin-bottom: 30px;
        }

        .logo {
            font-size: 28px; font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .lang-switch select {
            background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--border-glass);
            padding: 8px 15px; border-radius: 8px; outline: none; cursor: pointer;
        }
        .lang-switch select option { background: #0f172a; }

        .glass-panel {
            background: var(--dark-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: 20px;
            padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 15px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-glass); border-radius: 10px;
            color: white; font-size: 16px; transition: all 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); outline: none;
        }

        .btn-glow {
            width: 100%; padding: 15px; background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; border-radius: 10px; color: white; font-size: 18px;
            font-weight: bold; cursor: pointer; transition: all 0.3s;
        }
        .btn-glow:hover { box-shadow: 0 0 25px var(--primary); transform: translateY(-2px); }
        
        .loader { display: none; text-align: center; margin: 20px 0; }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #results-container { display: none; }
        .result-section {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass);
            padding: 20px; border-radius: 15px; margin-bottom: 20px;
            overflow-x: auto; /* حل مشكلة الجداول الطويلة في الجوال */
        }
        .result-section h3 { color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;}
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; /* ضمان عدم تشوه الجدول */ }
        th, td { border: 1px solid var(--border-glass); padding: 12px; text-align: right; }
        th { background: rgba(139, 92, 246, 0.2); }
        ul { padding-inline-start: 20px; line-height: 1.8; }

        #prototype-wrapper {
            width: 100%; height: 500px; border: 2px solid var(--primary);
            border-radius: 15px; overflow: hidden; margin-top: 20px; background: white;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .action-btns { display: flex; gap: 15px; margin-top: 30px; }
        .action-btns button { flex: 1; background: transparent; border: 2px solid var(--primary); }
        .action-btns button:hover { background: var(--primary); }

        .chatbot-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--primary); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: white; cursor: pointer;
            box-shadow: 0 0 20px var(--primary); z-index: 1000;
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-10px);} }
        
        .chat-window {
            position: fixed; bottom: 100px; right: 30px; width: 350px; height: 450px;
            background: var(--dark-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: 15px;
            display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .chat-header { background: var(--primary); padding: 15px; border-radius: 15px 15px 0 0; font-weight: bold; display: flex; justify-content: space-between;}
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 10px; max-width: 80%; line-height: 1.4;}
        .msg.user { background: rgba(255,255,255,0.1); align-self: flex-start; }
        .msg.ai { background: rgba(139, 92, 246, 0.3); align-self: flex-end; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid var(--border-glass); }
        .chat-input input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 5px; }
        .chat-input button { background: transparent; border: none; color: var(--primary); cursor: pointer; font-size: 18px; }

        footer { text-align: center; padding: 30px; margin-top: 50px; }
        .dev-name {
            font-size: 20px; font-weight: 700; color: #fff;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff; letter-spacing: 2px;
        }

        /* تعديلات الاتجاه الأيسر LTR */
        [dir="ltr"] th, [dir="ltr"] td { text-align: left; }
        [dir="ltr"] .chatbot-btn { right: auto; left: 30px; }
        [dir="ltr"] .chat-window { right: auto; left: 30px; }
        [dir="ltr"] .msg.user { align-self: flex-end; }
        [dir="ltr"] .msg.ai { align-self: flex-start; }

        /* ========================================= */
        /* استعلامات الوسائط لجعل الموقع متجاوباً للموبايل */
        /* ========================================= */
        @media (max-width: 768px) {
            header {
                flex-direction: column; gap: 15px; text-align: center;
            }
            .glass-panel { padding: 20px 15px; }
            
            .action-btns {
                flex-direction: column; /* الأزرار فوق بعضها في الهاتف */
            }
            
            #prototype-wrapper {
                height: 400px; /* تصغير نافذة العرض في الموبايل */
            }

            /* تعديل نافذة الشات لتناسب شاشة الهاتف */
            .chat-window {
                width: 90vw; height: 60vh;
                bottom: 100px; right: 5vw; left: 5vw;
            }
            [dir="ltr"] .chat-window { left: 5vw; right: auto; }
            
            .chatbot-btn {
                bottom: 20px; right: 20px;
                width: 50px; height: 50px; font-size: 20px;
            }
            [dir="ltr"] .chatbot-btn { left: 20px; right: auto; }
            
            table { min-width: 500px; /* السماح بالتمرير داخل الجدول دون تشويهه */ }
            
            .logo { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="galaxy-bg">
        <div class="nebula"></div>
        <div class="stars"></div>
        <div class="stars2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">Protoptimal</div>
            <div class="lang-switch">
                <select id="lang-selector" onchange="changeLanguage()">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
            </div>
        </header>

        <div class="glass-panel" id="form-section">
            <div class="input-group">
                <label id="lbl-name">اسم المشروع</label>
                <input type="text" id="proj-name" placeholder="مثال: SmartEco">
            </div>
            <div class="input-group">
                <label id="lbl-field">مجال المشروع</label>
                <input type="text" id="proj-field" placeholder="مثال: الذكاء الاصطناعي في الزراعة">
            </div>
            <div class="input-group">
                <label id="lbl-desc">وصف دقيق لفكرة المشروع</label>
                <textarea id="proj-desc" rows="4" placeholder="اكتب تفاصيل الفكرة، المشكلة التي يحلها، والجمهور المستهدف..."></textarea>
            </div>
            <button class="btn-glow" id="btn-generate" onclick="generateProject()">توليد بواسطة الذكاء الاصطناعي <i class="fa-solid fa-wand-magic-sparkles"></i></button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <h3 id="lbl-loading">جاري تحليل البيانات وصناعة السحر... يرجى الانتظار قد يستغرق الأمر دقيقة.</h3>
        </div>

        <div id="results-container" class="glass-panel">
            <div id="printable-area">
                <h2 id="res-title" style="text-align: center; margin-bottom: 20px; color: var(--secondary);">تقرير المشروع الشامل</h2>
                <div id="ai-content"></div> 
            </div>
            
            <div class="result-section">
                <h3 id="lbl-proto">المعاينة الحية للموقع (Prototype)</h3>
                <div id="prototype-wrapper">
                    <iframe id="proto-frame"></iframe>
                </div>
            </div>

            <div class="action-btns">
                <button class="btn-glow" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> <span id="btn-pdf">تحميل كـ PDF</span></button>
                <button class="btn-glow" onclick="downloadPPT()"><i class="fa-solid fa-file-powerpoint"></i> <span id="btn-ppt">تحميل كـ PowerPoint</span></button>
            </div>
        </div>
    </div>

    <!-- الروبوت العائم -->
    <div class="chatbot-btn" onclick="toggleChat()">
        <i class="fa-solid fa-robot"></i>
    </div>
    <div class="chat-window" id="chat-window">
        <div class="chat-header">
            <span id="chat-title">المساعد الذكي</span>
            <i class="fa-solid fa-times" style="cursor:pointer;" onclick="toggleChat()"></i>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="msg ai">مرحباً! أنا مساعد Protoptimal. كيف يمكنني مساعدتك في مشروعك اليوم؟</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chat-input-field" placeholder="اكتب سؤالك هنا..." onkeypress="handleChatEnter(event)">
            <button onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <footer>
        <p>by developer : <span class="dev-name">krelouf Aboubakr</span></p>
    </footer>

    <script>
        const API_KEY = "AIzaSyANa8WSfzWgwMtvTTYdBfwP36KMvdSTA2s"; 
        
        // تم حل المشكلة بتغيير النموذج من gemini-1.5-pro إلى gemini-1.5-flash المدعوم والمتاح بشكل أسرع
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        const dict = {
            ar: {
                name: "اسم المشروع", field: "مجال المشروع", desc: "وصف دقيق لفكرة المشروع",
                btnGen: "توليد بواسطة الذكاء الاصطناعي", loading: "جاري تحليل البيانات وصناعة السحر... يرجى الانتظار",
                pdf: "تحميل كـ PDF", ppt: "تحميل كـ PowerPoint", proto: "المعاينة الحية للموقع (Prototype)",
                chatTitle: "المساعد الذكي Protoptimal", aiError: "حدث خطأ في الاتصال بالذكاء الاصطناعي: "
            },
            en: {
                name: "Project Name", field: "Project Industry/Field", desc: "Detailed Project Description",
                btnGen: "Generate with AI", loading: "Analyzing data and creating magic... please wait",
                pdf: "Download as PDF", ppt: "Download as PowerPoint", proto: "Live Website Preview (Prototype)",
                chatTitle: "Protoptimal AI Assistant", aiError: "AI Connection Error: "
            },
            fr: {
                name: "Nom du projet", field: "Domaine du projet", desc: "Description détaillée du projet",
                btnGen: "Générer avec l'IA", loading: "Analyse des données et création magique... veuillez patienter",
                pdf: "Télécharger en PDF", ppt: "Télécharger en PowerPoint", proto: "Aperçu en direct du site (Prototype)",
                chatTitle: "Assistant IA Protoptimal", aiError: "Erreur de connexion IA : "
            }
        };

        let currentLang = 'ar';
        let generatedContentText = ""; 

        function changeLanguage() {
            currentLang = document.getElementById('lang-selector').value;
            const ui = dict[currentLang];
            
            document.documentElement.dir = (currentLang === 'ar') ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            document.getElementById('lbl-name').innerText = ui.name;
            document.getElementById('lbl-field').innerText = ui.field;
            document.getElementById('lbl-desc').innerText = ui.desc;
            document.getElementById('btn-generate').innerHTML = `${ui.btnGen} <i class="fa-solid fa-wand-magic-sparkles"></i>`;
            document.getElementById('lbl-loading').innerText = ui.loading;
            document.getElementById('btn-pdf').innerText = ui.pdf;
            document.getElementById('btn-ppt').innerText = ui.ppt;
            document.getElementById('lbl-proto').innerText = ui.proto;
            document.getElementById('chat-title').innerText = ui.chatTitle;
        }

        async function generateProject() {
            const name = document.getElementById('proj-name').value;
            const field = document.getElementById('proj-field').value;
            const desc = document.getElementById('proj-desc').value;

            if(!name || !field || !desc) {
                alert(currentLang === 'ar' ? "يرجى ملء جميع الحقول" : "Please fill all fields");
                return;
            }

            document.getElementById('form-section').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            const prompt = `
            You are an elite Business Consultant, Market Analyst, and Senior Frontend Developer. 
            I am creating a project. Here are the details:
            Project Name: "${name}"
            Industry/Field: "${field}"
            Description: "${desc}"
            Language required for output: ${currentLang === 'ar' ? 'Arabic' : currentLang === 'en' ? 'English' : 'French'}.

            I need a highly detailed, extremely comprehensive response strictly formatted using the following XML tags so I can parse them. Do NOT use markdown code blocks like \`\`\`html.
            
            <analysis>
            Write inside this tag pure, beautiful HTML (using <div>, <h3>, <ul>, <p>, <table>, <th>, <td>). Apply inline CSS for tables to look good in dark mode.
            Include these exact sections, making them EXTREMELY DETAILED AND LONG:
            1. <h3>Logo Proposal</h3>: Write a highly professional prompt for Midjourney/DALL-E to generate the perfect logo. Explain the color psychology chosen.
            2. <h3>Premium Domains</h3>: Propose 3 creative and available-like domain names.
            3. <h3>SWOT Analysis</h3>: Create a detailed HTML <table> with 4 sections (Strengths, Weaknesses, Opportunities, Threats).
            4. <h3>Business Model Canvas (BMC)</h3>: Create a complete, detailed HTML <table> covering all 9 blocks.
            5. <h3>Pros (Positives)</h3>: A long <ul> list of pros.
            6. <h3>Cons (Negatives)</h3>: A long <ul> list of cons and risks.
            7. <h3>Competitors Analysis</h3>: A detailed list of real-world competitors in this specific niche, mentioning their strengths and weaknesses.
            8. <h3>Innovative Ideas</h3>: Suggest 5 highly creative and unique features to make this project stand out from the competition.
            </analysis>

            <proto_html>
            Write inside this tag a complete, modern, interactive Landing Page HTML structure for this project. Include a Header, Hero Section, Features Section, and Footer. Use placeholder images. DO NOT include <html> or <body> tags, just the inner structure.
            </proto_html>

            <proto_css>
            Write modern, beautiful CSS for the landing page above. Use animations, flexbox/grid, and a modern color palette fitting the project field. DO NOT include <style> tags. Make it responsive.
            </proto_css>
            `;

            try {
                const response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.7 }
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                const textResp = data.candidates[0].content.parts[0].text;
                
                const analysisMatch = textResp.match(/<analysis>([\s\S]*?)<\/analysis>/i);
                const htmlMatch = textResp.match(/<proto_html>([\s\S]*?)<\/proto_html>/i);
                const cssMatch = textResp.match(/<proto_css>([\s\S]*?)<\/proto_css>/i);

                const analysisHtml = analysisMatch ? analysisMatch[1] : "حدث خطأ في استخراج التحليل.";
                const protoHtml = htmlMatch ? htmlMatch[1] : "<h1>Error generating HTML</h1>";
                const protoCss = cssMatch ? cssMatch[1] : "body { background: #fff; color:#000; }";

                document.getElementById('ai-content').innerHTML = `<div class="result-section">${analysisHtml}</div>`;
                generatedContentText = document.getElementById('ai-content').innerText; 

                const iframe = document.getElementById('proto-frame');
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(`
                    <!DOCTYPE html>
                    <html dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                    <head>
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
                        <style>
                            body { font-family: 'Cairo', sans-serif; margin:0; padding:0; box-sizing:border-box;}
                            ${protoCss}
                        </style>
                    </head>
                    <body>
                        ${protoHtml}
                    </body>
                    </html>
                `);
                iframeDoc.close();

                document.getElementById('loader').style.display = 'none';
                document.getElementById('results-container').style.display = 'block';

            } catch (err) {
                alert(dict[currentLang].aiError + err.message);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('form-section').style.display = 'block';
            }
        }

        function downloadPDF() {
            const element = document.getElementById('printable-area');
            const opt = {
                margin:       10,
                filename:     'Protoptimal_Report.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            element.style.background = "#fff";
            element.style.color = "#000";
            const sections = element.querySelectorAll('.result-section');
            sections.forEach(s => s.style.overflowX = "visible"); // منع قص الجداول في الـ PDF
            const tables = element.querySelectorAll('table, th, td');
            tables.forEach(t => t.style.borderColor = "#000");

            html2pdf().set(opt).from(element).save().then(()=>{
                element.style.background = "transparent";
                element.style.color = "var(--text-main)";
                sections.forEach(s => s.style.overflowX = "auto"); // إرجاع التمرير للهاتف
                tables.forEach(t => t.style.borderColor = "var(--border-glass)");
            });
        }

        async function downloadPPT() {
            let pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            let slide = pptx.addSlide();
            slide.background = { color: "020617" };
            slide.addText(`Project Report: ${document.getElementById('proj-name').value}`, { 
                x:1, y:2, w:'80%', h:2, fontSize:36, color:'8b5cf6', bold:true, align:'center' 
            });

            const sections = generatedContentText.split(/(?=Logo Proposal|Premium Domains|SWOT Analysis|Business Model Canvas|Pros|Cons|Competitors Analysis|Innovative Ideas)/i);
            
            sections.forEach(sec => {
                if(sec.trim().length > 10) {
                    let s = pptx.addSlide();
                    s.background = { color: "0f172a" };
                    s.addText(sec.substring(0, 1500), { x:0.5, y:0.5, w:'90%', h:'80%', fontSize:14, color:'ffffff', align: document.documentElement.dir==='rtl' ? 'right':'left' });
                }
            });

            pptx.writeFile({ fileName: "Protoptimal_Presentation.pptx" });
        }

        function toggleChat() {
            const chat = document.getElementById('chat-window');
            chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleChatEnter(e) {
            if(e.key === 'Enter') sendChatMessage();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input-field');
            const msg = input.value.trim();
            if(!msg) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="msg user">${msg}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const prompt = `
            You are the official AI assistant for a website called "Protoptimal". 
            Protoptimal is an AI-powered platform that helps users build comprehensive project plans, generate SWOT, BMC, competitors analysis, and creates live UI prototypes.
            User asked: "${msg}"
            Answer politely and concisely in ${currentLang === 'ar' ? 'Arabic' : currentLang === 'en' ? 'English' : 'French'}.
            `;

            try {
                const response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.5 }
                    })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                chatBox.innerHTML += `<div class="msg ai">${reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg ai">عذراً، حدث خطأ في الاتصال.</div>`;
            }
        }
    </script>
</body>
</html>
